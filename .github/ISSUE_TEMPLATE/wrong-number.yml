name: A number looks wrong
description: RulerCraft gave a measurement you do not believe
labels: ["wrong-number"]
body:
  - type: textarea
    attributes:
      label: What you measured and what RulerCraft said
      description: The feature (hole, face, distance), the number it gave, and the number you expected.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How you know the expected number
      description: Design dimension, calipers (how many readings), a published spec. Do not paste other programs' output.
    validations:
      required: true
  - type: textarea
    attributes:
      label: How to reproduce
      description: The command, MCP call or app steps. Attach the mesh if you can share it; say so if you cannot.
  - type: input
    attributes:
      label: Version or commit
