# SPDX-License-Identifier: MIT OR Apache-2.0
name: solidcraft-plugin
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths: ["plugin/**", "crates/rulercraft-mesh/**", "fixtures/known/**", "tools/agent_smoke.py", ".github/workflows/solidcraft-plugin*.yml"]
  pull_request:
    paths: ["plugin/**", "crates/rulercraft-mesh/**", "fixtures/known/**", "tools/agent_smoke.py", ".github/workflows/solidcraft-plugin*.yml"]
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: plugin/solidcraft
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Format and lints
        working-directory: plugin/solidcraft
        run: |
          cargo fmt --check
          cargo clippy --locked --target wasm32-unknown-unknown -- -D warnings
      - name: Fetch the checked SolidCraft host
        shell: bash
        run: |
          host=solidcraft-0.45.0-rc.4-linux-x86_64
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/tangency-labs/solidcraft/releases/download/v0.45.0-rc.4/$host.tar.gz" \
            --output "$RUNNER_TEMP/$host.tar.gz"
          cd "$RUNNER_TEMP"
          printf '%s  %s\n' f964cf35caaae7b30c1176863cf4a8ba62c32e030b15f9f6c8a066b264510ed4 "$host.tar.gz" | sha256sum --check
          tar -xzf "$host.tar.gz" "$host/bin/solidcraft-cli"
          echo "SOLIDCRAFT_CLI=$RUNNER_TEMP/$host/bin/solidcraft-cli" >> "$GITHUB_ENV"
      - name: Build and test the package in SolidCraft
        run: plugin/solidcraft/build.sh
      - name: Install the ZIP and verify an editable known part
        run: |
          export XDG_CONFIG_HOME="$RUNNER_TEMP/solidcraft-config"
          export XDG_DATA_HOME="$RUNNER_TEMP/solidcraft-data"
          export XDG_CACHE_HOME="$RUNNER_TEMP/solidcraft-cache"
          python3 tools/agent_smoke.py plugin/solidcraft/dist/rulercraft-solidcraft-plugin.zip \
            fixtures/known/hole-block.stl "$SOLIDCRAFT_CLI" --known-hole-block
      - name: Record package checksum and source revision
        working-directory: plugin/solidcraft/dist
        run: |
          sha256sum rulercraft-solidcraft-plugin.zip > SHA256SUMS.txt
          git rev-parse HEAD > SOURCE-COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: rulercraft-plugin-preview
          path: |
            plugin/solidcraft/dist/rulercraft-solidcraft-plugin.zip
            plugin/solidcraft/dist/SHA256SUMS.txt
            plugin/solidcraft/dist/SOURCE-COMMIT.txt
          if-no-files-found: error
      - name: Upload the install ZIP without a wrapper
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          archive: false
          path: plugin/solidcraft/dist/rulercraft-solidcraft-plugin.zip
          if-no-files-found: error
