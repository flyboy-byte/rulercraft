# SPDX-License-Identifier: MIT OR Apache-2.0
# Publishes the SolidCraft plugin package as a GitHub release when a tag `plugin-v<version>` is pushed
# (docs/install-solidcraft-plugin.md). The tag must equal plugin.json's version. Pushing the tag is the
# publishing moment, so it needs Logan's yes (AGENTS.md).
name: solidcraft-plugin-release
on:
  push:
    tags: ["plugin-v*"]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches plugin.json
        run: |
          want="plugin-v$(python3 -c 'import json;print(json.load(open("plugin/solidcraft/package/plugin.json"))["version"])')"
          test "$want" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, plugin.json says $want" >&2; exit 1; }
      - name: Rust toolchain with the WebAssembly target
        run: |
          rustup toolchain install stable --profile minimal --target wasm32-unknown-unknown
          rustup default stable
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-tools
      - name: Build the package
        run: plugin/solidcraft/build.sh
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(sha256sum plugin/solidcraft/dist/rulercraft-solidcraft-plugin.zip | cut -d' ' -f1)
          {
            echo "RulerCraft for SolidCraft, plugin ${GITHUB_REF_NAME#plugin-v}."
            echo
            echo "Install: SolidCraft › Preferences › Plugins › Install plugin…, pick rulercraft-solidcraft-plugin.zip."
            echo "Guide: https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/docs/install-solidcraft-plugin.md"
            echo
            echo "SHA-256 of the .zip: $sha"
          } > notes.md
          gh release create "$GITHUB_REF_NAME" plugin/solidcraft/dist/rulercraft-solidcraft-plugin.zip \
            --title "RulerCraft for SolidCraft ${GITHUB_REF_NAME#plugin-v}" --notes-file notes.md --prerelease
