[workspace]
resolver = "3"
members = ["crates/rulercraft-mesh", "crates/rulercraft-cli", "crates/rulercraft-mcp"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/flyboy-byte/rulercraft"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
