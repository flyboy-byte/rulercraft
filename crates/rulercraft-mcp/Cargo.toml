[package]
name = "rulercraft-mcp"
description = "RulerCraft mesh commands over MCP stdio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version = "1.88"

[dependencies]
rulercraft-mesh = { path = "../rulercraft-mesh" }
rmcp = { version = "3.9", default-features = false, features = ["server", "macros", "schemars", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "io-std"] }

[lints]
workspace = true
